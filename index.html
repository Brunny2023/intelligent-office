<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Global Office — The Enterprise Cognition Platform</title>
    <meta name="description" content="Global Office gives every organization a virtual C-suite, expert AI consultants, and AI-run departments that reason, decide, and remember on your own data — the enterprise cognition platform." />
    <meta name="keywords" content="enterprise cognition, AI executive, virtual C-suite, AI consultants, organizational intelligence, decision support, enterprise AI platform, corporate operating system" />
    <meta name="author" content="Global Office" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://globaloffice.cloud/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/globaloffice-logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://globaloffice.cloud/" />
    <meta property="og:title" content="Global Office — The Enterprise Cognition Platform" />
    <meta property="og:description" content="A virtual C-suite, expert consultants, and AI-run departments reasoning on your organization's own data. Not a productivity suite — an intelligence layer." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:site_name" content="Global Office" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://globaloffice.cloud/" />
    <meta name="twitter:title" content="Global Office — The Enterprise Cognition Platform" />
    <meta name="twitter:description" content="Virtual C-suite, expert consultants, and AI-run departments reasoning on your own data." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1a2744" />
    <meta name="msapplication-TileColor" content="#1a2744" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Global Office",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "The Enterprise Cognition Platform: a virtual C-suite, expert AI consultants, and AI-run departments that reason, decide, and remember on your organization's own data.",
      "url": "https://globaloffice.cloud",
      "image": "/og-image.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free trial available"
      },
      "creator": {
        "@type": "Organization",
        "name": "Global Office",
        "url": "https://globaloffice.cloud"
      },
      "featureList": [
        "Attendance & Time Tracking",
        "Task & Project Management",
        "Team Messaging & Channels",
        "HR & Recruitment",
        "Finance & Payroll",
        "AI-Powered Insights",
        "Executive Dashboard",
        "Security & Compliance",
        "Organization Branding"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Global Office",
      "url": "https://globaloffice.cloud",
      "logo": "https://globaloffice.cloud/globaloffice-logo.png",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Global Office",
      "url": "https://globaloffice.cloud",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://globaloffice.cloud/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
